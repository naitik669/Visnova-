<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VisNova logo</title>
  <desc id="desc">A white V with an orbit and star on a purple rounded-square background.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="56" x2="424" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9b8ff"/>
      <stop offset="0.48" stop-color="#a883ff"/>
      <stop offset="1" stop-color="#8358ff"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(166 96) rotate(56) scale(330 280)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#6d42de" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="44" y="36" width="424" height="424" rx="96" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="44" y="36" width="424" height="424" rx="96" fill="url(#shine)"/>

  <g transform="translate(0 -2)">
    <path d="M122 150h86l68 154 69-154h79L310 381h-68L122 150Z" fill="#fff"/>
    <path d="M116 327c60 38 179 18 267-49 66-51 79-99 55-116" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" opacity="0.98"/>
    <path d="M121 328c53 27 148 13 232-38" fill="none" stroke="#8b63ff" stroke-width="7" stroke-linecap="round" opacity="0.78"/>
  </g>
  <path
    d="M414 106c7 29 13 35 42 42-29 7-35 13-42 42-7-29-13-35-42-42 29-7 35-13 42-42Z"
    fill="#fff"
  />
</svg>
